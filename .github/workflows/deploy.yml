name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint and test
        run: |
          bun run typecheck
          bun run lint
          bun run test

      - name: Build
        run: bun run build
        env:
          VITE_WS_URL: wss://pistasjug.ar/chacarero/ws

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The room server: the droplet pulls main and rebuilds its image (seconds,
  # only changed layers). Skipped until the DEPLOY_SSH_KEY secret exists; see
  # deploy/README.md. The key is pinned to one forced command on the droplet.
  server:
    runs-on: ubuntu-latest
    needs: build
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Deploy room server
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$DEPLOY_SSH_KEY" > ~/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/known_hosts
          ssh -i ~/deploy_key -o UserKnownHostsFile=~/known_hosts root@167.172.140.176 deploy
          curl -sf https://pistasjug.ar/chacarero/health
