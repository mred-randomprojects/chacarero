# Runs next to Piñas Cruzadas on the droplet: same Docker network, so the
# existing Caddy can reverse-proxy pistasjug.ar/terrateniente/* to this container.
# Built on the droplet from a checkout of this repo (deploy/remote.sh).
name: terrateniente

services:
  terrateniente:
    build: .
    image: terrateniente:latest
    container_name: terrateniente
    restart: unless-stopped
    expose:
      - "9902"
    environment:
      - PORT=9902
      - ROOMS_FILE=/data/rooms.json
    # Rooms are saved here on stop and restored on start (server/snapshot.ts).
    volumes:
      - terrateniente-data:/data
    stop_grace_period: 10s

volumes:
  terrateniente-data:

networks:
  default:
    name: pinas-cruzadas_default
    external: true
