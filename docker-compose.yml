# Runs next to Piñas Cruzadas on the droplet: same Docker network, so the
# existing Caddy can reverse-proxy pistasjug.ar/chacarero/* to this container.
# Built on the droplet from a checkout of this repo (deploy/remote.sh).
services:
  chacarero:
    build: .
    image: chacarero:latest
    container_name: chacarero
    restart: unless-stopped
    expose:
      - "9902"
    environment:
      - PORT=9902
      - ROOMS_FILE=/data/rooms.json
    # Rooms are saved here on stop and restored on start (server/snapshot.ts).
    volumes:
      - chacarero-data:/data
    stop_grace_period: 10s

volumes:
  chacarero-data:

networks:
  default:
    name: pinas-cruzadas_default
    external: true
